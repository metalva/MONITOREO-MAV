<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Agua y Presión</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #048553; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px; 
            min-height: 100vh;
        }
        h2 { margin-bottom: 25px; color: #00d2ff; }
        h3 { margin-bottom: 10px; }
        
        /* --- Pantalla de Login con fondo de Petróleo --- */
        #login-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d1a0a 50%, #0a0a0a 100%);
            overflow: hidden;
            z-index: -1;
        }

        .oil-drop {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #333, #0a0a0a);
            opacity: 0.3;
        }

        .oil-drop-1 { width: 200px; height: 200px; top: -50px; left: 10%; animation: float 6s ease-in-out infinite; }
        .oil-drop-2 { width: 150px; height: 150px; top: 20%; right: 5%; animation: float 8s ease-in-out infinite 1s; }
        .oil-drop-3 { width: 100px; height: 100px; bottom: 10%; left: 15%; animation: float 7s ease-in-out infinite 2s; }
        .oil-drop-4 { width: 180px; height: 180px; top: 50%; right: 10%; animation: float 9s ease-in-out infinite 1.5s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) translateX(0px); }
            50% { transform: translateY(-30px) translateX(20px); }
        }

        .oil-derrick {
            position: absolute;
            font-size: 60px;
            opacity: 0.15;
        }
        .oil-derrick-1 { top: 5%; left: 5%; }
        .oil-derrick-2 { bottom: 10%; right: 8%; transform: rotate(15deg); }
        .oil-derrick-3 { top: 40%; left: 10%; transform: rotate(-10deg); }

        .oil-barrel {
            position: absolute;
            font-size: 50px;
            opacity: 0.12;
        }
        .oil-barrel-1 { top: 20%; right: 15%; }
        .oil-barrel-2 { bottom: 30%; left: 20%; }
        
        /* --- Estilos del Login --- */
        #login-contenedor {
            background-color: rgba(5, 105, 58, 0.95);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.3);
            width: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
            position: relative;
            z-index: 10;
        }
        #login-contenedor .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d2ff, #048004);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
        }
        .form-grupo {
            width: 100%;
            margin-bottom: 15px;
        }
        .form-grupo label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .form-grupo input {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #555;
            background: #413b3b;
            color: #fff;
            font-size: 14px;
        }
        #mensaje-error {
            color: #ff3333;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
            font-weight: bold;
        }

        /* --- Panel de Control --- */
        #dashboard-contenedor {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        .dashboard { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; }
        .card { 
            background-color: #068554; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.664); 
            width: 350px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        
        /* --- Botones --- */
        .btn { 
            padding: 10px 20px; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 14px; 
            transition: background 0.2s; 
        }
        .btn-login { 
            background-color: #00d2ff; 
            color: #048553; 
            width: 100%; 
            font-size: 16px; 
            margin-top: 10px; 
        }
        .btn-login:hover { background-color: #008ca6; }
        .btn-toggle { 
            background-color: #008cba; 
            color: white; 
            margin-bottom: 5px; 
        }
        .btn-toggle:hover { background-color: #007399; }
        .btn-aplicar { 
            background-color: #4CAF50; 
            color: white; 
        }
        .btn-aplicar:hover { background-color: #45a049; }

        /* --- Luces Testigos --- */
        .alarm-container { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin-bottom: 20px; 
        }
        .indicador-luz { 
            width: 70px; 
            height: 70px; 
            border-radius: 50%; 
            background-color: #048004; 
            box-shadow: inset 0 3px 8px rgba(255,255,255,0.3), 0 0 10px rgba(255, 255, 255, 0.5); 
            margin-bottom: 15px; 
            transition: background-color 0.3s, box-shadow 0.3s; 
        }
        .indicador-luz.rojo-on { 
            background-color: #ff3333; 
            box-shadow: inset 0 3px 8px rgba(255,255,255,0.4), 0 0 20px #ff0000; 
        }
        .indicador-luz.verde-on { 
            background-color: #0b7552; 
            box-shadow: inset 0 3px 8px rgba(255,255,255,0.4), 0 0 20px #00cc00; 
        } 
        
        /* --- Manómetros --- */
        .gauge-wrapper { 
            position: relative; 
            width: 200px; 
            height: 120px; 
            margin-bottom: 15px; 
        }
        .gauge-body { 
            width: 200px; 
            height: 100px; 
            border-radius: 200px 200px 0 0; 
            background: #08a2c9; 
            overflow: hidden; 
            position: relative; 
        }
        .gauge-fill { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 200px; 
            height: 100px; 
            border-radius: 200px 200px 0 0; 
            background: linear-gradient(to right, #131414, #030303); 
            transform-origin: center bottom; 
            transform: rotate(0deg); 
            transition: transform 0.5s ease; 
        }
        .gauge-cover { 
            width: 140px; 
            height: 70px; 
            border-radius: 140px 140px 0 0; 
            background-color: #2d2d2d; 
            position: absolute; 
            bottom: 0; 
            left: 30px; 
        }
        .gauge-text { 
            position: absolute; 
            bottom: 10px; 
            width: 100%; 
            text-align: center; 
            font-size: 20px; 
            font-weight: bold; 
            color: #ddd; 
        }
        
        .control-grupo { 
            display: flex; 
            gap: 10px; 
            align-items: center; 
        }
        input[type="number"] { 
            width: 80px; 
            padding: 5px; 
            border-radius: 5px; 
            border: 1px solid #555; 
            background: #413b3b; 
            color: #fff; 
            text-align: center; 
        }

        hr {
            width: 100%;
            margin: 15px 0;
            border: none;
            border-top: 1px solid #444;
        }
    </style>
</head>
<body>

    <!-- Fondo de Login con tema de Petróleo -->
    <div id="login-screen">
        <div class="oil-drop oil-drop-1"></div>
        <div class="oil-drop oil-drop-2"></div>
        <div class="oil-drop oil-drop-3"></div>
        <div class="oil-drop oil-drop-4"></div>
        
        <div class="oil-derrick oil-derrick-1">🛢️</div>
        <div class="oil-derrick oil-derrick-2">🛢️</div>
        <div class="oil-derrick oil-derrick-3">🛢️</div>
        
        <div class="oil-barrel oil-barrel-1">⛽</div>
        <div class="oil-barrel oil-barrel-2">⛽</div>
    </div>

    <!-- Formulario de Login -->
    <div id="login-contenedor">
        <div class="logo">MAV</div>
        <h2>Iniciar Sesión</h2>
        <div class="form-grupo">
            <label for="usuario">Usuario:</label>
            <input type="text" id="usuario" placeholder="Ingresa tu usuario">
        </div>
        <div class="form-grupo">
            <label for="clave">Contraseña:</label>
            <input type="password" id="clave" placeholder="Ingresa tu clave">
        </div>
        <div id="mensaje-error">Usuario o contraseña incorrectos.</div>
        <button class="btn btn-login" onclick="validarLogin()">Ingresar</button>
    </div>

    <!-- Panel de Control -->
    <div id="dashboard-contenedor">
        <h2>Panel de Monitoreo</h2>
        
        <div class="dashboard">
            <!-- Sistema 1 -->
            <div class="card">
                <h3>Sistema 1</h3>
                <hr>
                <div class="alarm-container">
                    <div class="indicador-luz" id="luz-alarma-1"></div>
                    <span>Nivel de Agua Bajo</span>
                    <button class="btn btn-toggle" onclick="toggleAlarma(1)">Activar/Apagar Alarma</button>
                </div>
                <hr>
                <div class="gauge-wrapper">
                    <div class="gauge-body">
                        <div class="gauge-fill" id="fill-1"></div>
                        <div class="gauge-cover"></div>
                    </div>
                    <div class="gauge-text" id="valor-display-1">0.0 bar</div>
                </div>
                <div class="control-grupo">
                    <input type="number" id="input-bar-1" min="0" max="10" step="0.1" placeholder="0-10">
                    <button class="btn btn-aplicar" onclick="actualizarManometro(1)">Aplicar Presión</button>
                </div>
            </div>

            <!-- Sistema 2 -->
            <div class="card">
                <h3>Sistema 2</h3>
                <hr>
                <div class="alarm-container">
                    <div class="indicador-luz" id="luz-alarma-2"></div>
                    <span>Nivel de Agua Bajo</span>
                    <button class="btn btn-toggle" onclick="toggleAlarma(2)">Activar/Apugar Alarma</button>
                </div>
                <hr>
                <div class="gauge-wrapper">
                    <div class="gauge-body">
                        <div class="gauge-fill" id="fill-2"></div>
                        <div class="gauge-cover"></div>
                    </div>
                    <div class="gauge-text" id="valor-display-2">0.0 bar</div>
                </div>
                <div class="control-grupo">
                    <input type="number" id="input-bar-2" min="0" max="10" step="0.1" placeholder="0-10">
                    <button class="btn btn-aplicar" onclick="actualizarManometro(2)">Aplicar Presión</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function validarLogin() {
            const usuarioIngresado = document.getElementById('usuario').value;
            const claveIngresada = document.getElementById('clave').value;
            
            if (usuarioIngresado === 'mav' && claveIngresada === '1234_mav') {
                document.getElementById('login-contenedor').style.display = 'none';
                document.getElementById('dashboard-contenedor').style.display = 'flex';
                document.getElementById('login-screen').style.display = 'none';
            } else {
                document.getElementById('mensaje-error').style.display = 'block';
            }
        }

        function toggleAlarma(numero) {
            const luz = document.getElementById(`luz-alarma-${numero}`);
            luz.classList.toggle('rojo-on');
        } 

        function actualizarManometro(numero) {
            const inputVal = document.getElementById(`input-bar-${numero}`).value;
            const display = document.getElementById(`valor-display-${numero}`);
            
            let presion = parseFloat(inputVal);
            if (isNaN(presion)) presion = 0;
            if (presion < 0) presion = 0;
            if (presion > 10) presion = 10;
            
            const grados = presion * 18; 
            
            if(numero === 1){
                document.getElementById('fill-1').style.transform = `rotate(${grados}deg)`;
            } else {
                document.getElementById('fill-2').style.transform = `rotate(${grados}deg)`;
            }
            display.innerText = `${presion.toFixed(1)} bar`;
        }
    </script>
    
</body>
</html>
